name: Automated API Tests

on:
  push:
    branches: [ "main" ]

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cài đặt Newman CLI & HTML Extra
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Thực thi kiểm thử hướng dữ liệu (Data-Driven)
        run: newman run ReqRes_Collection.json -e ReqRes_Environment.json -d users.csv --reporters cli,htmlextra --reporter-htmlextra-export report.html

      - name: Upload Báo cáo HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HTML-Report
          path: report.html
